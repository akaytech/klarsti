# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  # Günlük yeniden yayın. Blog yazıları veritabanında duruyor ve sitede anında
  # görünüyor, ama arama motorunun okuduğu gerçek HTML sayfalar derleme
  # sırasında üretiliyor. Bu olmadan yeni bir yazı, biri kod gönderene kadar
  # Google için görünmez kalırdı.
  schedule:
    - cron: '0 3 * * *'
  # Elle tetikleme: yazı yayınlandıktan hemen sonra beklemek istemezsen
  # GitHub'da Actions sekmesinden "Run workflow" diyebilirsin.
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Geliştirmede kullanılan sürümle aynı kalmalı: derlemenin yerelde
          # geçip yayında patlaması hep bu farktan çıkıyor.
          node-version: '24'
          cache: 'npm'
      # SENTRY_AUTH_TOKEN varsa derleme, hata izlerini okunur kılan harita
      # dosyalarını üretip Sentry'ye yükler ve sonra siler (bkz. vite.config.ts).
      # Secret tanımlı değilse adım aynen çalışır, sadece yükleme atlanır.
      - run: npm ci
      # Testler derlemeden ONCE: bozuk bir kayit yolu yayina cikmasin.
      # Derleme gecse bile testler kalirsa is burada durur.
      # Ceviri denetimi: anahtar/placeholder paritesi, gorunmez karakter,
      # hitap bicimi, tirnak birligi, cogul kurallari (bkz. scripts/i18nLint.mjs).
      - run: npm run i18n:lint
      - run: npm test
      - run: npm run build:firebase
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Blog yazılarını Firestore'dan okumak için (bkz. scripts/blogCek.mjs).
          # Aynı hesap zaten aşağıda yayın için kullanılıyor. Yetkisi yoksa
          # derleme durmaz, yalnızca blog sayfaları üretilmez ve kayıtta uyarı
          # görünür.
          FIREBASE_SERVICE_ACCOUNT_KLARSTI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARSTI }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARSTI }}
          channelId: live
          projectId: klarsti
