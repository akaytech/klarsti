<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sekme ikonu küçük dosya olmalı: eskiden 1024x1024'lük logo.png (837 KB)
         verildiği için her ziyaret sırf favicon uğruna o dosyayı indiriyordu.

         Dosya adlari marka degisikliginde bilerek yenilendi (favicon-32 ->
         klarsti-ikon-32 vb.). Eski adlar dururken sadece iceriklerini
         degistirmistik; Google ikonlari adrese gore sakladigi icin arama
         sonuclarinda haftalarca eski Solvinger ikonu gorunmeye devam etti.
         Ikon degisirse dosyanin adi da degismeli. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%klarsti-ikon-32.png" />
    <!-- Google arama sonuclarindaki ikon icin. Kucuk olani sekme icin yeterli
         ama Google ikonun 48'in kati bir boyutta olmasini istiyor; 32x32 onun
         altinda kaliyor ve secilecegi garanti degil. Tarayici sekme icin yine
         kucugunu aliyor, bu dosya yalnizca 3 KB. -->
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%klarsti-ikon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%klarsti-ikon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mobil tarayicilarda adres cubugunun rengi. Manifest'teki theme_color
         ile ayni kalmali (bkz. vite.config.ts). -->
    <meta name="theme-color" content="#c70f4d" />
    
    <!-- SEO Meta Tags -->
    <title>Klarsti — Problem solving and decision making that follows the method</title>
    <meta name="description" content="Problem solving, root cause analysis and planning tools that follow the actual method: SWOT, Fishbone, 5 Whys, Pareto, WBS, Gantt and more. Free while in early access." />
    <meta name="keywords" content="problem solving, SWOT analysis, Ishikawa, fishbone diagram, 5 whys, WBS, decision matrix, root cause analysis, productivity tools" />
    <meta name="author" content="Klarsti" />
    <meta name="robots" content="index, follow" />
    <!-- Site ayni anda klarsti.web.app ve klarsti.firebaseapp.com uzerinden de
         yayinlaniyor. Bunlar Firebase'in sistem adresleri, silinemiyor. Canonical
         etiketi arama motoruna asil adresin hangisi oldugunu soyluyor; boylece
         yinelenen icerik sayilmiyoruz ve siralama gucu tek adreste birikiyor.

         Bu dosya ayni zamanda arac sayfalarinin sablonu: scripts/staticPages.mjs
         build sonunda bunun kopyalarini alip title, description, keywords,
         canonical ve og/twitter etiketlerini sayfa basina degistiriyor. O yuzden
         bu etiketlerin bicimi (tek satir, content="...") korunmali; script
         bulamazsa build hata verir. -->
    <link rel="canonical" href="https://klarsti.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <!-- Arama sonuclarinda alan adi ("klarsti.com") yerine marka adinin
         yazilmasi icin: Google site adini og:site_name ve asagidaki WebSite
         yapilandirilmis verisinden okuyor. -->
    <meta property="og:site_name" content="Klarsti" />
    <meta property="og:title" content="Klarsti — Problem solving and decision making that follows the method" />
    <meta property="og:description" content="Seventeen problem-solving and planning tools on one canvas. Each one follows the standard method of its own discipline. Free while in early access." />
    <meta property="og:image" content="https://klarsti.com/klarsti-paylasim.png" />
    <meta property="og:url" content="https://klarsti.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klarsti — Problem solving and decision making that follows the method" />
    <meta name="twitter:description" content="Seventeen problem-solving and planning tools on one canvas, each following its own discipline's standard method." />
    <meta name="twitter:image" content="https://klarsti.com/klarsti-paylasim.png" />

    <!-- Google'in site adi olarak "klarsti.com" degil "Klarsti" yazmasi icin
         gereken isaret. Google bunu yalnizca ana sayfadan okuyor; arac
         sayfalarina da kopyalaniyor olmasi zararsiz, orada yok sayiliyor.

         sameAs: markanin resmi hesaplari. Arama motoru bu hesaplarin bize ait
         oldugunu buradan anliyor; aksi halde ayni ada sahip baska hesaplarla
         ayirt edemiyor. Alt bilgideki listeyle ayni kalmali
         (bkz. src/components/SocialIcons.tsx). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Klarsti",
          "url": "https://klarsti.com/"
        },
        {
          "@type": "Organization",
          "name": "Klarsti",
          "url": "https://klarsti.com/",
          "logo": "https://klarsti.com/klarsti-ikon-512.png",
          "email": "support@klarsti.com",
          "sameAs": [
            "https://www.instagram.com/klarsti.app/",
            "https://www.facebook.com/klarstiapp",
            "https://www.linkedin.com/company/klarsti/",
            "https://x.com/Klarsti",
            "https://www.tiktok.com/@klarsti",
            "https://www.threads.com/@klarsti.app",
            "https://bsky.app/profile/klarsti.bsky.social"
          ]
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Sitenin tek yazı tipi: Inter. Burada duruyor, index.css'te değil;
         CSS içinden @import etmek yazı tipi isteğini CSS inene kadar
         bekletiyor.

         Adres tek tek kalınlıkları değil `wght@100..900` aralığını istiyor:
         bu, Google'ın değişken (variable) sürümünü döndürüyor. Onu istemek
         şart, çünkü sitede `font-black` (900) ve `font-extrabold` (800) çok
         yerde kullanılıyor. Sabit kalınlıklar istendiğinde 900 listede yoktu
         ve tarayıcı 700'ü şişirerek sahte bir kalın çiziyordu.

         Italik ekli değil: sitede italik yazı hiç kullanılmıyor, eklemek
         indirilecek dosya sayısını ikiye katlardı. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <!-- Tema, React yüklenmeden önce uygulanmalı. Aksi halde sayfa önce
         aydınlık açılıp sonra koyuya dönüyor (beyaz parlama). theme.ts'teki
         id listesi ve eski 'dark' kaydının eşlemesi burayla aynı kalmalı. -->
    <script>
      (function () {
        try {
          var known = ['light', 'deep-night', 'dark', 'graphite', 'blossom', 'pistachio'];
          var darkThemes = ['deep-night', 'dark', 'graphite'];
          var saved = localStorage.getItem('klarsti-theme');
          if (known.indexOf(saved) === -1) {
            // Eski kurgu: 'theme' anahtarında sadece 'dark' / 'light' vardı.
            saved = localStorage.getItem('theme') === 'dark' ? 'deep-night' : 'light';
          }
          var root = document.documentElement;
          root.classList.add('theme-' + saved);
          if (darkThemes.indexOf(saved) !== -1) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
