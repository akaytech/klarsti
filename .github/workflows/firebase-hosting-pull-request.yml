name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Yayın akışıyla aynı sürüm (bkz. firebase-hosting-merge.yml).
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Testler derlemeden ONCE: bozuk bir kayit yolu yayina cikmasin.
      # Derleme gecse bile testler kalirsa is burada durur.
      # Ceviri denetimi: anahtar/placeholder paritesi, gorunmez karakter,
      # hitap bicimi, tirnak birligi, cogul kurallari (bkz. scripts/i18nLint.mjs).
      - run: npm run i18n:lint
      - run: npm test
      - run: npm run build:firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARSTI }}
          projectId: klarsti
