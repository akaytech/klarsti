# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # SENTRY_AUTH_TOKEN varsa derleme, hata izlerini okunur kılan harita
      # dosyalarını üretip Sentry'ye yükler ve sonra siler (bkz. vite.config.ts).
      # Secret tanımlı değilse adım aynen çalışır, sadece yükleme atlanır.
      - run: npm ci && npm run build:firebase
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KLARSTI }}
          channelId: live
          projectId: klarsti
